name: Verificar conexao com o banco

# Demonstra como as credenciais saem dos Secrets/Variables do GitHub
# e chegam ao codigo PHP atraves de variaveis de ambiente.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  db-check:
    runs-on: ubuntu-latest

    # Os Secrets/Variables sao expostos como variaveis de ambiente.
    # O db.php le exatamente esses nomes (DB_HOST, DB_PORT, ...).
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ vars.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql

      - name: Validar sintaxe do db.php
        run: php -l db.php

      - name: Testar conexao com o banco
        # Pode falhar se o Hostinger nao permitir acesso remoto dos IPs do
        # GitHub Actions (Remote MySQL). Nesse caso, o teste serve so para
        # validar que os Secrets chegaram ao codigo.
        continue-on-error: true
        run: php -r 'require "db.php"; conectarBanco(); echo "Conexao OK\n";'
